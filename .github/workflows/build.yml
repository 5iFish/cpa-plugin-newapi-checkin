name: Build and verify

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: windows-amd64
          - runner: ubuntu-24.04
            platform: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
    env:
      GOWORK: 'off'
      CGO_ENABLED: '1'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        if: runner.os == 'Windows'
        id: msys2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Add Windows compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          '${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Check release version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$(tr -d '\r\n' < VERSION)"
          fi
      - name: Unit tests, vet, and UI tests
        shell: bash
        run: |
          go test ./... -count=1 -timeout=180s
          go vet ./...
          node --test tests/ui/console.test.mjs
      - name: Build Windows library
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Build Linux library
        if: runner.os == 'Linux'
        run: sh scripts/build.sh
      - name: Checkout pinned CPA host
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: router-for-me/CLIProxyAPI
          ref: e5e6ad1e1b91fc20ab9964e6fb22c0c269b9d882
          path: .test-artifacts/cpa-src
          persist-credentials: false
      - name: Real CPA integration (Linux)
        if: runner.os == 'Linux'
        run: |
          go -C .test-artifacts/cpa-src build -o "$GITHUB_WORKSPACE/.test-artifacts/cpa-host" ./cmd/server
          export CPA_TEST_BIN="$GITHUB_WORKSPACE/.test-artifacts/cpa-host"
          export CPA_TEST_PLUGIN="$GITHUB_WORKSPACE/dist/${{ matrix.platform }}/newapi-checkin.so"
          go test -tags=integration ./tests/integration -count=1 -v -timeout=5m
      - name: Real CPA integration (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hostPath = Join-Path $PWD '.test-artifacts/cpa-host.exe'
          go -C .test-artifacts/cpa-src build -o $hostPath ./cmd/server
          if ($LASTEXITCODE -ne 0) { throw 'CPA host build failed' }
          $env:CPA_TEST_BIN = $hostPath
          $env:CPA_TEST_PLUGIN = Join-Path $PWD 'dist/windows-amd64/newapi-checkin.dll'
          go test -tags=integration ./tests/integration -count=1 -v -timeout=5m
          if ($LASTEXITCODE -ne 0) { throw 'CPA integration failed' }
      - name: Package release asset
        run: python scripts/package-release.py --platform ${{ matrix.platform }}
      - name: Upload verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: newapi-checkin-${{ matrix.platform }}
          path: dist/release/*/*.zip
          if-no-files-found: error

  release-bundle:
    name: Collect packages and checksums
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: newapi-checkin-*
          merge-multiple: true
          path: dist/bundle
      - name: Generate complete checksum file
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          folder = Path('dist/bundle')
          expected = {f'newapi-checkin_{version}_{platform}.zip' for platform in ('windows_amd64', 'linux_amd64', 'linux_arm64')}
          actual = {path.name for path in folder.glob('*.zip')}
          if actual != expected:
              raise SystemExit(f'Incomplete release assets: expected {sorted(expected)}, got {sorted(actual)}')
          lines = [f'{hashlib.sha256((folder / name).read_bytes()).hexdigest()}  {name}\n' for name in sorted(expected)]
          (folder / 'checksums.txt').write_text(''.join(lines), encoding='utf-8')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: newapi-checkin-release-bundle
          path: dist/bundle/*
          if-no-files-found: error
